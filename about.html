<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card round-corner mx-auto">

                        <div class="card-body">
                            
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card round-corner mx-auto">
                        <h2 class="text-center">Rehan Ali</h2>
                        <img src="img/about/rehan.jpg" alt="Tudor Barcan" class="about-img mx-auto round-corner">
                        <div class="card-body">
                            
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
